name: update-words

# The EDRDG licence asks for regular updates of JMdict data from the most
# recent version. Once a month this regenerates vocab/data/words.json.gz and
# opens (or updates) a PR when the word data changed.
#
# PRs opened with the default token do not trigger ci.yml; this job already
# ran the vocab tests against the new data.

on:
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: update-words

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # bash with -o pipefail: a failing vocabgen in "vocabgen | tee" fails the step.
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: update-words
      TITLE: "fix(vocab): update word data from JMdict"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download sources
        run: |
          src="$RUNNER_TEMP/src"
          mkdir -p "$src"
          # ftp.edrdg.org has no valid certificate for https (checked 2026-10-13).
          curl -fsSL -D "$src/headers.txt" -o "$src/JMdict.gz" http://ftp.edrdg.org/pub/Nihongo/JMdict.gz
          git clone -q --depth 1 https://github.com/stephenmk/yomitan-jlpt-vocab "$src/jlpt"
          modified=$(grep -i '^last-modified:' "$src/headers.txt" | cut -d' ' -f2- | tr -d '\r')
          if [ -z "$modified" ]; then
            echo "JMdict.gz response has no Last-Modified header" >&2
            exit 1
          fi
          commit=$(git -C "$src/jlpt" rev-parse HEAD)
          {
            echo "SRC=$src"
            echo "JMDICT_MODIFIED=$modified"
            echo "JLPT_COMMIT=$commit"
          } >> "$GITHUB_ENV"

      - name: Generate word data
        run: |
          go run ./cmd/vocabgen -jmdict "$SRC/JMdict.gz" -jlpt "$SRC/jlpt/original_data" \
            -out vocab/data/words.json.gz | tee "$SRC/stats.txt"
          printf 'jmdict-last-modified: %s\njlpt-mapping-commit: %s\n' \
            "$JMDICT_MODIFIED" "$JLPT_COMMIT" > vocab/data/SOURCES

      - name: Test
        run: go test -count=1 ./vocab/

      - name: Open or update the PR
        run: |
          # A changed SOURCES alone (new upstream file, same words) is no reason for a PR.
          if git diff --quiet -- vocab/data/words.json.gz; then
            echo "Word data unchanged."
            exit 0
          fi
          stats=$(cat "$SRC/stats.txt")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add vocab/data/words.json.gz vocab/data/SOURCES
          git commit -q -m "$TITLE" -m "$stats"
          # An earlier run may have pushed the same data already; force-pushing
          # it again would only churn the open PR.
          if git fetch -q --depth 1 origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" 2>/dev/null &&
            git diff --quiet "origin/$BRANCH" -- vocab/data; then
            echo "Branch $BRANCH already has this word data; not pushing."
          else
            git push --force origin "$BRANCH"
          fi
          open=$(gh pr list --head "$BRANCH" --state open --json number -q length)
          if [ "$open" -gt 0 ]; then
            echo "PR already open."
            exit 0
          fi
          body=$(printf '%s\n\nJMdict Last-Modified: %s\nJLPT mapping commit: %s\n\nGenerated by the monthly update-words workflow.' \
            "$stats" "$JMDICT_MODIFIED" "$JLPT_COMMIT")
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$body"
